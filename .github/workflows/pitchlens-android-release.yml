# PitchLens 사용자 앱 — Release APK → GitHub Releases

name: PitchLens Android Release

on:
  push:
    tags:
      - "pitchlens-v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "APK 버전 이름 (예: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

env:
  APP_DIR: Client/pitchlens-frontend
  REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'http://122.36.99.66:8080' }}
  REACT_APP_FEEDBACK_API_URL: ${{ vars.REACT_APP_FEEDBACK_API_URL || 'http://122.36.99.66:8001' }}
  REACT_APP_VOICE_API_URL: ${{ vars.REACT_APP_VOICE_API_URL || 'http://122.36.99.66:8765' }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # Server 폴더의 중첩 git(서브모듈) 때문에 checkout/cache/git 128이 나지 않도록 최소 경로만 체크아웃
      - name: Checkout (frontend only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            Client/pitchlens-frontend
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#pitchlens-v}"
            TAG="${GITHUB_REF_NAME}"
          else
            NAME="${{ inputs.version_name }}"
            TAG="pitchlens-v${NAME}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Build web + Capacitor sync
        working-directory: ${{ env.APP_DIR }}
        env:
          CI: "false"
          GENERATE_SOURCEMAP: "false"
        run: npm run build && npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (compileSdk 35)
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode release keystore
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "::error::ANDROID_KEYSTORE_BASE64 Secret 필요" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore || (echo "::error::keystore 디코딩 실패" && exit 1)

      - name: Build signed Release APK
        working-directory: ${{ env.APP_DIR }}/android
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }} \
            --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Upload Gradle log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ${{ env.APP_DIR }}/gradle-build.log

      - name: Locate Release APK
        id: apk
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "=== APK search ==="
          find android -name "*.apk" -type f 2>/dev/null || true

          SRC=""
          for candidate in \
            "android/app/build/outputs/apk/release/app-release.apk" \
            "android/app/build/outputs/apk/release/app-release-unsigned.apk"; do
            if [ -f "$candidate" ]; then
              SRC="$candidate"
              break
            fi
          done

          if [ -z "$SRC" ]; then
            echo "::error::APK를 찾을 수 없습니다. 위 단계(Build signed Release APK) 로그 또는 gradle-build-log 아티팩트를 확인하세요."
            exit 1
          fi

          if [[ "$SRC" == *"-unsigned.apk" ]]; then
            echo "::error::서명된 APK가 아닙니다. GitHub Secrets(키스토어)를 확인하세요."
            exit 1
          fi

          DST="android/app/build/outputs/apk/release/PitchLens-${{ steps.version.outputs.name }}.apk"
          mkdir -p "$(dirname "$DST")"
          cp "$SRC" "$DST"
          echo "path=$PWD/$DST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: PitchLens-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK="${{ steps.apk.outputs.path }}"
          TITLE="PitchLens ${{ steps.version.outputs.name }}"
          NOTES="PitchLens Android APK. API: ${{ env.REACT_APP_API_URL }}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload "$TAG" "$APK" --clobber
