# PitchLens 사용자 앱 — Release APK 빌드 후 GitHub Releases 업로드
#
# 최초 1회: Client/pitchlens-frontend/scripts/export-android-keystore-secrets.ps1 실행 후
#           GitHub 저장소 Secrets 등록 (docs/GITHUB_ANDROID_RELEASE.md 참고)
#
# 배포 트리거:
#   - git tag pitchlens-v1.0.0 && git push origin pitchlens-v1.0.0
#   - Actions 탭 → "PitchLens Android Release" → Run workflow

name: PitchLens Android Release

on:
  push:
    tags:
      - "pitchlens-v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "APK 버전 이름 (예: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

env:
  APP_DIR: Client/pitchlens-frontend
  REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'http://122.36.99.66:8080' }}
  REACT_APP_FEEDBACK_API_URL: ${{ vars.REACT_APP_FEEDBACK_API_URL || 'http://122.36.99.66:8001' }}
  REACT_APP_VOICE_API_URL: ${{ vars.REACT_APP_VOICE_API_URL || 'http://122.36.99.66:8765' }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#pitchlens-v}"
          else
            NAME="${{ inputs.version_name }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=pitchlens-v$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install npm dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Build web assets and Capacitor sync
        working-directory: ${{ env.APP_DIR }}
        run: npm run cap:sync

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::GitHub Secrets에 ANDROID_KEYSTORE_BASE64 가 필요합니다. docs/GITHUB_ANDROID_RELEASE.md 를 참고하세요."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build signed Release APK
        working-directory: ${{ env.APP_DIR }}/android
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }} \
            --no-daemon

      - name: Rename APK artifact
        run: |
          SRC="${{ env.APP_DIR }}/android/app/build/outputs/apk/release/app-release.apk"
          DST="${{ env.APP_DIR }}/android/app/build/outputs/apk/release/PitchLens-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$DST"
          echo "apk_path=$DST" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PitchLens ${{ steps.version.outputs.name }}
          body: |
            PitchLens 사용자 앱 Android Release APK

            - 버전: ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})
            - API: Auth `${{ env.REACT_APP_API_URL }}`, Feedback `${{ env.REACT_APP_FEEDBACK_API_URL }}`

            **설치:** APK 다운로드 → 「출처를 알 수 없는 앱」허용 후 설치
          files: ${{ env.apk_path }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
