# PitchLens 사용자 앱 — Release APK 빌드 후 GitHub Releases 업로드

name: PitchLens Android Release

on:
  push:
    tags:
      - "pitchlens-v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "APK 버전 이름 (예: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

env:
  APP_DIR: Client/pitchlens-frontend
  REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'http://122.36.99.66:8080' }}
  REACT_APP_FEEDBACK_API_URL: ${{ vars.REACT_APP_FEEDBACK_API_URL || 'http://122.36.99.66:8001' }}
  REACT_APP_VOICE_API_URL: ${{ vars.REACT_APP_VOICE_API_URL || 'http://122.36.99.66:8765' }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#pitchlens-v}"
            TAG="${GITHUB_REF_NAME}"
          else
            NAME="${{ inputs.version_name }}"
            TAG="pitchlens-v${NAME}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # npm cache는 중첩 git(서브모듈) 저장소에서 git exit 128을 유발할 수 있어 사용하지 않음
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Build web assets and Capacitor sync
        working-directory: ${{ env.APP_DIR }}
        env:
          CI: "false"
        run: npm run cap:sync

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 Secret이 필요합니다."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore

      - name: Build signed Release APK
        working-directory: ${{ env.APP_DIR }}/android
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }} \
            --no-daemon --stacktrace

      - name: Locate Release APK
        id: apk
        run: |
          DIR="${{ env.APP_DIR }}/android/app/build/outputs/apk/release"
          ls -la "$DIR" || true
          if [ -f "$DIR/app-release.apk" ]; then
            SRC="$DIR/app-release.apk"
          else
            echo "::error::서명된 app-release.apk를 찾을 수 없습니다."
            exit 1
          fi
          DST="$DIR/PitchLens-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK="${{ steps.apk.outputs.path }}"
          TITLE="PitchLens ${{ steps.version.outputs.name }}"
          NOTES="PitchLens 사용자 앱 Android Release APK. 설치 시 출처를 알 수 없는 앱 허용이 필요합니다."

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload "$TAG" "$APK" --clobber
